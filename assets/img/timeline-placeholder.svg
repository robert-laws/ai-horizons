<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">AI timeline placeholder</title>
  <desc id="desc">Timeline showing AI evolution from the 1990s to the 2020s in academia.</desc>
  <rect width="1200" height="320" fill="#f5fffe"/>
  <line x1="90" y1="160" x2="1110" y2="160" stroke="#0f7f93" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" font-size="20" fill="#124a56" text-anchor="middle">
    <circle cx="160" cy="160" r="22" fill="#86dbc9"/><text x="160" y="122">1990s</text><text x="160" y="205">Rule-based</text>
    <circle cx="380" cy="160" r="22" fill="#7fd4df"/><text x="380" y="122">2000s</text><text x="380" y="205">Search agents</text>
    <circle cx="600" cy="160" r="22" fill="#71c5ee"/><text x="600" y="122">2010s</text><text x="600" y="205">Learning analytics</text>
    <circle cx="820" cy="160" r="22" fill="#7de0c5"/><text x="820" y="122">2020s</text><text x="820" y="205">Generative AI</text>
    <circle cx="1040" cy="160" r="22" fill="#5ec2a8"/><text x="1040" y="122">2030s</text><text x="1040" y="205">Human-AI pedagogy</text>
  </g>
</svg>
